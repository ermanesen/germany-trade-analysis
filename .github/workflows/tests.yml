name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . -r requirements.txt
      - run: pytest -q
      - run: python scripts/run_analysis.py
      - run: jupyter nbconvert --to notebook --execute notebooks/analysis.ipynb --output analysis.ipynb --output-dir notebooks --ExecutePreprocessor.timeout=180
